name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04  # the image these checks were verified on; ubuntu-latest becomes 26.04 from 19 Oct 2026
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install matplotlib   # figures only; the instrument has no dependency
      - name: instrument tests
        run: cd instrument && python -m unittest discover -s tests -v
      - name: analysis tests
        run: cd analysis && python -m unittest discover -s tests -v
      - name: MCP handshake without a model
        run: cd instrument && python run_r3.py doctor
      - name: rehearsal of the gate phase (no model call)
        run: |
          cd instrument
          python sprint_autorun.py --phase gate --backend rehearsal --runs /tmp/rehearsal --rehearsal-policy chain_payload
          python ../analysis/results_blocks.py /tmp/rehearsal
          python ../analysis/coding_sheet.py sheet /tmp/rehearsal/gate --n 8 --out /tmp/rehearsal/coding
